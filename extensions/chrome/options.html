<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SmartCursor</title>
    <style>
      body { font: 14px -apple-system, sans-serif; margin: 32px; max-width: 520px; color: #18181b; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input { width: 100%; margin-top: 6px; padding: 8px 10px; border: 1px solid #d4d4d8; border-radius: 10px; }
      button { margin-top: 16px; border: 0; border-radius: 999px; background: #18181b; color: white; padding: 8px 14px; }
      p { color: #52525b; line-height: 1.45; }
    </style>
  </head>
  <body>
    <h1>Connect SmartCursor</h1>
    <p>Copy the local address and pairing token from SmartCursor Settings → Integrations. The extension only talks to 127.0.0.1.</p>
    <label>Local address<input id="baseUrl" placeholder="http://127.0.0.1:17645" /></label>
    <label>Pairing token<input id="token" type="password" /></label>
    <button id="save" type="button">Save</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
